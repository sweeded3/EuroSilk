<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#cc0000">
    <title>Страница не найдена | EURO SILK</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <style>
        :root { --primary:#cc0000; --secondary:#ffcc00; --dark:#222; --light:#f8f8f8; --white:#fff; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--light); color:var(--dark); font-family:Arial, sans-serif; line-height:1.6; }
        main { width:min(100% - 32px, 640px); padding:36px; border-radius:18px; background:var(--white); box-shadow:0 10px 30px rgba(0,0,0,.12); text-align:center; }
        h1 { margin:0 0 12px; color:var(--primary); font-size:clamp(2rem, 8vw, 4rem); }
        a { display:inline-block; margin-top:18px; padding:12px 22px; border-radius:999px; background:var(--primary); color:var(--white); font-weight:700; text-decoration:none; }
        a:hover { background:#a90000; }
    </style>
</head>
<body>
    <main>
        <h1>404</h1>
        <p>Страница не найдена. Возможно, адрес был изменён или введён с ошибкой.</p>
        <a href="index.html">Вернуться на главную</a>
    </main>
</body>
</html>
